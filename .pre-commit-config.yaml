# Hygiene hooks, carried over from the skills' previous home with their excludes re-based to this root. The
# skill packages were formatted under exactly these settings, so a full run must change nothing: a hook that
# rewrote a deployed skill would change what every agent loads.
# `pre-commit install` wires both stages. Every hook runs at pre-commit unless it names its own stage; only the
# pushed-identity check runs at pre-push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  # Secrets scanner over the STAGED DIFF only, so it finds nothing under --all-files; `just secrets` scans the
  # whole history. The hook is a golang-language hook, so pre-commit builds it once from source. Revisions
  # are frozen to commits; Dependabot proposes updates.
  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # frozen: v1.9.0
    hooks:
      - id: betterleaks
  # mdformat normalizes Markdown structure while preserving deliberate prose line breaks. Archived skills and
  # verbatim upstream files are excluded because hygiene hooks must not rewrite them.
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "keep", "--number", "--no-codeformatters"]
        exclude: >-
          ^(archived/|(.+/)?skill-forge/scripts/skills-ref/|(.+/)?repo-management/assets/ISSUE_TEMPLATE/|(.+/)?brooks-)
        additional_dependencies:
          - mdformat-footnote==0.1.3
          - mdformat-frontmatter==2.1.2
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-simple-breaks==0.1.0
          - mdformat-toc==0.5.0
          - mdformat-config==0.2.1
          - mdformat-wikilink==0.3.0
          - markdown-it-py==4.2.0
          - mdit-py-plugins==0.6.1
          - mdurl==0.1.2
          - ruamel.yaml==0.19.1
          - taplo==0.9.3
          - wcwidth==0.9.2
  # markdownlint owns the 120-column ceiling; its ignores live in .markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--no-globs"]
  # skill-forge's vendored skills-ref copy is pinned third-party code, outside this repository's lint policy.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 8a948e557ca98afa9489998ad0b85515964df9c4 # frozen: v0.12.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        exclude: ^(.+/)?skill-forge/scripts/skills-ref/
      - id: ruff-format
        exclude: ^(.+/)?skill-forge/scripts/skills-ref/
  - repo: local
    hooks:
      # U+00A0 in Markdown indentation breaks nested fences without any visible sign.
      - id: markdown-nbsp-indent
        name: no non-breaking space in Markdown indentation
        language: pygrep
        entry: '^(?:[ \t]|\xc2\xa0)*\xc2\xa0'
        types_or: [markdown, mdx]
      - id: shfmt
        name: shfmt (format shell scripts)
        entry: shfmt
        args: ["-i", "2", "-ci", "-bn", "-sr", "-w"]
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck (lint shell scripts)
        entry: shellcheck
        language: system
        types: [shell]
      - id: mypy-checks
        name: mypy (skill checks)
        entry: uv run --frozen mypy
        language: system
        files: ^checks/
        types: [python]
        pass_filenames: false
      # The skill checks read the whole tree, so each runs once whenever a file it reads changes.
      - id: skill-spec
        name: Agent Skills specification (skills-ref)
        entry: uv run --frozen skill-checks spec
        language: system
        files: (^|/)SKILL\.md$
        pass_filenames: false
      # Always runs: the policy also checks that each referenced file exists and that a LICENSE.upstream has
      # its ATTRIBUTIONS.md, so deleting or renaming one of those breaks it without any SKILL.md changing.
      - id: skill-policy
        name: skill-forge local policy
        entry: uv run --frozen skill-checks policy
        language: system
        always_run: true
        pass_filenames: false
      - id: skill-descriptions
        name: skill descriptions are inline and within budget
        entry: uv run --frozen skill-checks descriptions
        language: system
        files: (^|/)SKILL\.md$
        pass_filenames: false
      - id: skill-names
        name: skill names are unique
        entry: uv run --frozen skill-checks names
        language: system
        files: (^|/)SKILL\.md$
        pass_filenames: false
      - id: skill-references
        name: no reference leaves its skill package
        entry: uv run --frozen skill-checks references
        language: system
        types_or: [markdown, python, shell]
        pass_filenames: false
      # The repository is public and its history carries only the noreply address.
      - id: commit-identity
        name: commit identity is the noreply address
        entry: uv run --frozen skill-checks identity
        language: system
        always_run: true
        pass_filenames: false
      # Publishing is where a wrong address does harm, and a rebase, a cherry-pick or a clone without hooks
      # skips the commit-time check. pre-commit passes only the first pushed ref, so this reads every local
      # branch and tag the remote does not hold.
      - id: pushed-identity
        name: pushed commits carry only the noreply address
        entry: uv run --frozen skill-checks pushed-identity
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
