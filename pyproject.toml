[project]
name = "agent-skills-checks"
version = "0.1.0"
description = "Checks for the agent-skills repository's skill packages."
requires-python = ">=3.12"
dependencies = ["attrs>=25.3"]

[project.scripts]
skill-checks = "skill_checks.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  # skill-forge's bundled policy validator, quick_validate.py, parses frontmatter with it.
  "pyyaml>=6.0",
  # The Agent Skills specification validator; its command is `agentskills validate`.
  "skills-ref==0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks/skill_checks"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["checks/tests"]

# The skill scripts were formatted under these settings in their previous home, so keeping them unchanged keeps
# every hook at its fixed point: a formatter run must not rewrite a deployed skill.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skill_checks"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["checks"]
