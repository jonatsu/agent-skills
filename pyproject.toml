[project]
name = "agent-skills-checks"
version = "0.1.0"
description = "Checks for the agent-skills repository's skill packages."
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.3",
    "jsonschema>=4.23",
]

[project.scripts]
skill-checks = "skill_checks.cli:main"

[dependency-groups]
dev = [
  # markdown-tools' scripts parse Markdown with it; their tests run them in this environment.
  "markdown-it-py>=4.3.0",
  "mdit-py-plugins>=0.7.0",
  "mypy>=1.17",
  "pre-commit>=4",
  "pytest>=8.4",
  # skill-forge's bundled policy validator, quick_validate.py, parses frontmatter with it.
  "pyyaml>=6.0",
  # The Agent Skills specification validator; its command is `agentskills validate`.
  "skills-ref==0.1.1",
  "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checks/skill_checks"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["checks/tests"]

# 120 matches .editorconfig's max_line_length and the Markdown line limit.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skill_checks"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["checks"]
