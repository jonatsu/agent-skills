[tools]
python = "3.12.14"
uv = "0.12.21"
just = "1.58.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"pipx:pre-commit" = "4.6.2"
# The history scan behind `just secrets`; the pre-commit hook builds its own copy for staged changes.
"aqua:betterleaks/betterleaks" = "1.9.0"
# Compiles and lints the Rust skills' code examples. Pinned because clippy's lints and their levels change
# between releases.
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[settings]
# The uv-managed .venv (uv.lock is committed) holds the checks and their test tools.
python.uv_venv_auto = "create|source"
