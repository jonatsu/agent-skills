<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account menu</title>
  <style>
    .menu-button { cursor: pointer; padding: 8px; }
    .menu-button:focus { outline: none; }
    .items { list-style: none; margin: 0; padding: 0; }
    .items li { cursor: pointer; padding: 6px 8px; }
  </style>
</head>
<body>
  <nav class="menu">
    <div class="menu-button" role="button" onclick="toggleMenu()">Account &#9662;</div>
    <ul id="items" class="items" style="display: none" aria-hidden="true">
      <li onclick="location.href='/profile'">Profile</li>
      <li onclick="location.href='/settings'">Settings</li>
      <li onclick="signOut()">Sign out</li>
    </ul>
  </nav>
  <script>
    function toggleMenu() {
      const items = document.getElementById("items");
      items.style.display = items.style.display === "none" ? "block" : "none";
    }
    function signOut() {
      fetch("/signout", { method: "POST" }).then(() => { location.href = "/"; });
    }
  </script>
</body>
</html>
