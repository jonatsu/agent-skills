# Every check `just check` runs locally. The secrets scan runs first, so a failing hook cannot skip it. The
# commit-identity hook is local only, because a runner has no committer identity of its own. Actions are pinned
# by commit; mise installs only the tool versions and checksums mise.lock records.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Fail rather than resolve a tool version mise.lock does not hold.
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the secrets scan.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.2
      - name: Scan the whole history for secrets
        run: just secrets
      - name: Install the checks
        run: uv sync --frozen
      # The Rust example check records the examples that passed and keeps its build here, so a run proves only
      # the examples that changed. Each run saves a new entry; a run restores the newest one for its lockfiles.
      - name: Restore the Rust example build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/rust-examples
            ~/.cargo/registry
          key: rust-examples-${{ hashFiles('checks/rust_examples/Cargo.lock', 'mise.lock') }}-${{ github.sha }}
          restore-keys: rust-examples-${{ hashFiles('checks/rust_examples/Cargo.lock', 'mise.lock') }}-
      - name: Run every hook and test
        env:
          SKIP: commit-identity
        run: just hooks test
