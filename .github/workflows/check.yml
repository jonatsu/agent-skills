# Every check `just check` runs locally, plus a secrets scan of the whole history. The commit-identity hook is
# local only: a runner has no committer identity of its own. Actions are pinned by commit; mise pins and
# checksum-verifies every tool.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the secrets scan below.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install the checks
        run: uv sync --frozen
      - name: Run every check and test
        env:
          SKIP: commit-identity
        run: just check
      - name: Scan the whole history for secrets
        run: betterleaks git . --exit-code 1
